
name: Django CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: task_manager_db
          POSTGRES_USER: taskmanager_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskmanager_user -d task_manager_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: "django-ci-test-only-key"
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      POSTGRES_DB: task_manager_db
      POSTGRES_USER: taskmanager_user
      POSTGRES_PASSWORD: test_password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Django configuration
        run: python manage.py check

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run Django tests
        run: python manage.py test
