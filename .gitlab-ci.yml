
stages:
  - test

django_tests:
  stage: test
  tags:
    - task-manager-docker
  image: python:3.12
  services:
    - name: postgres:16
      alias: db
    - name: redis:7-alpine
      alias: redis

  variables:
    POSTGRES_DB: task_manager_test
    POSTGRES_USER: taskmanager_user
    DB_HOST: db
    POSTGRES_PASSWORD: "$CI_POSTGRES_PASSWORD"
    DB_PORT: "5432"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    SECRET_KEY: "ci-only-secret-key-not-for-production"
    DEBUG: "False"
    ALLOWED_HOSTS: "localhost,127.0.0.1"

  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt

  script:
    - python manage.py check
    - python manage.py test

